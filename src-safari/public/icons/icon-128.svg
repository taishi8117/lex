<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)"/>

  <!-- Book/Page L shape -->
  <g fill="white">
    <!-- Vertical stroke (book spine) -->
    <rect x="32" y="24" width="18" height="80" rx="2"/>

    <!-- Page layers (horizontal, fanning out) -->
    <rect x="32" y="86" width="64" height="14" rx="2"/>
    <rect x="38" y="76" width="52" height="6" rx="1" opacity="0.7"/>
    <rect x="44" y="68" width="40" height="4" rx="1" opacity="0.4"/>
  </g>
</svg>
