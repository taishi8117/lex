<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lex Dictionary</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      min-width: 280px;
      background: #fff;
      color: #212529;
    }
    @media (prefers-color-scheme: dark) {
      body {
        background: #1e1e1e;
        color: #e4e4e4;
      }
    }
    h1 {
      font-size: 18px;
      margin: 0 0 16px;
    }
    p {
      font-size: 14px;
      line-height: 1.5;
      color: #6c757d;
    }
    .instruction {
      background: #f8f9fa;
      padding: 12px;
      border-radius: 8px;
      margin: 8px 0;
    }
    @media (prefers-color-scheme: dark) {
      .instruction {
        background: #2d2d2d;
      }
    }
  </style>
</head>
<body>
  <h1>Lex Dictionary</h1>
  <p>Look up words while browsing Safari.</p>

  <div class="instruction">
    <strong>Long-press</strong> any word on a webpage to see definitions.
  </div>

  <div class="instruction">
    <strong>Share Sheet:</strong> Select text, tap Share, then choose "Look up with Lex".
  </div>

  <p style="margin-top: 16px; font-size: 12px;">
    Configure providers and API keys in the Lex app.
  </p>
</body>
</html>
