<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="48" height="48" rx="10" fill="url(#bgGrad)"/>

  <!-- Book/Page L shape -->
  <g fill="white">
    <!-- Vertical stroke (book spine) -->
    <rect x="12" y="9" width="7" height="30" rx="1"/>

    <!-- Page layers (horizontal) -->
    <rect x="12" y="32" width="24" height="6" rx="1"/>
    <rect x="14" y="28" width="18" height="3" rx="0.5" opacity="0.7"/>
    <rect x="16" y="25" width="13" height="2" rx="0.5" opacity="0.4"/>
  </g>
</svg>
